<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8faf8"><meta name="description" content="Spreadsheet editor">
<title>Spreadsheets</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
<div class="tabs-row cortex-tabbar">
  <nav class="ribbon-tabs cortex-tabstrip" aria-label="Ribbon tabs" id="ribbon-tabs">

    <button data-tab="Home" class="selected">Home</button><button data-tab="Insert">Insert</button><button data-action="more-tabs" class="more-tabs-button" aria-label="Show more tabs" aria-expanded="false"><svg class="tab-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><button data-tab="Page Layout" class="extra-tab" hidden>Page Layout</button><button data-tab="Formulas" class="extra-tab" hidden>Formulas</button><button data-tab="Data" class="extra-tab" hidden>Data</button><button data-tab="View" class="extra-tab" hidden>View</button>
  </nav>
  <div class="document-actions cortex-toolbar-actions"><div class="document-title" hidden><input id="workbook-title" value="Revenue operations · FY2026"><span id="save-status"></span><span id="autosave-toggle" class="toggle on"></span></div><div class="quick-actions"><button data-action="undo" title="Undo (Ctrl / ⌘ Z)" aria-label="Undo" data-icon="undo"></button><button data-action="redo" title="Redo (Ctrl / ⌘ Shift Z)" aria-label="Redo" data-icon="redo"></button></div><button class="cortex-export" data-action="export"><svg class="export-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg><span>Export</span><svg class="export-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button></div>
</div>
<section class="ribbon" id="ribbon" aria-label="Formatting controls"></section>
<div class="formula-row">
  <input id="name-box" value="G13" aria-label="Cell address or range" spellcheck="false"><span class="name-chevron">⌄</span>
  <span class="formula-divider"></span><button data-action="cancel-edit" class="formula-control" title="Cancel edit (Escape)" aria-label="Cancel edit">×</button><button data-action="commit-edit" class="formula-control accept" title="Apply edit" aria-label="Apply edit">✓</button><button data-action="functions" class="fx" title="Insert function">ƒx</button>
  <input id="formula-input" spellcheck="false" autocomplete="off" aria-label="Formula bar" value="=SUM(D13:F13)"><button data-action="expand-formula" class="formula-expand" title="Expand formula input" aria-label="Expand formula input">⌄</button>
</div>
<div class="workspace" id="workspace">
  <main id="grid-host" class="grid-host" tabindex="0" role="grid" aria-label="Spreadsheet" aria-rowcount="1048576" aria-colcount="16384" aria-activedescendant="active-cell-description">
    <div class="chart-layer" id="chart-layer"></div>
    <textarea id="cell-editor" class="cell-editor" spellcheck="false" aria-label="Edit cell" hidden></textarea>
    <div id="formula-suggestions" class="formula-suggestions" hidden></div>
    <div class="v-scrollbar" id="v-scrollbar"><div class="scroll-thumb" id="v-thumb"></div></div>
    <div class="h-scrollbar" id="h-scrollbar"><div class="scroll-thumb" id="h-thumb"></div></div>
    <div class="sr-only" id="active-cell-description" role="gridcell" aria-live="polite"></div>
    <div id="loading" class="loading"><span>Opening your workspace…</span></div>
  </main>
  <aside class="side-panel" id="side-panel" hidden></aside>
</div>
<div class="sheet-bar">
  <div class="sheet-navigation"><button data-action="prev-sheet" title="Previous sheet" aria-label="Previous sheet">‹</button><button data-action="next-sheet" title="Next sheet" aria-label="Next sheet">›</button><button data-action="sheets" title="All worksheets" aria-label="All worksheets" data-icon="list"></button></div>
  <div id="sheet-tabs" class="sheet-tabs"></div><button class="new-sheet" data-action="add-sheet" title="New worksheet" aria-label="New worksheet">＋</button>
</div>
<footer class="statusbar">
  <span id="mode-status">Ready</span><span class="status-divider"></span><button class="renderer-status" id="renderer-status" data-action="performance"><span class="engine-dot"></span><span id="backend-label">Starting engine</span></button>
  <span id="selection-stats" class="selection-stats"></span>
  <div class="view-controls"><button data-action="toggle-gridlines" title="Toggle gridlines" aria-label="Toggle gridlines" data-icon="grid"></button><button data-action="theme" title="Toggle dark mode" aria-label="Toggle dark mode" data-icon="moon"></button><span class="status-divider"></span><button data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><input id="zoom-slider" type="range" min="50" max="200" step="10" value="100" aria-label="Worksheet zoom"><button data-action="zoom-in" title="Zoom in" aria-label="Zoom in">＋</button><button id="zoom-value" data-action="zoom-reset" title="Reset zoom">100%</button></div>
</footer>
</div>
<div id="context-menu" class="context-menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<input id="file-input" type="file" accept=".spreadsheet,.gridline,.json,.csv,.tsv,.xlsx" hidden>
<input id="fill-picker" type="color" value="#e2efda" hidden><input id="text-picker" type="color" value="#176b4a" hidden>
<div id="print-area" hidden></div>
<noscript>Spreadsheets needs JavaScript enabled to render and edit worksheets.</noscript>
<script type="module" src="src/app.js"></script>
</body></html>
